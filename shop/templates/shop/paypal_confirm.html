<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procesando pago - TecnoStock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
    }
    .paypal-card {
      background: #fff;
      border-radius: .9rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .12);
      width: 100%;
      max-width: 380px;
      padding: 2.5rem 1.75rem;
      text-align: center;
    }
    .paypal-word { font-weight: 800; font-size: 1.4rem; color: #003087; margin-bottom: 1.5rem; }
    .paypal-word span { color: #FFB300; }
    .spinner-border { width: 3rem; height: 3rem; color: #003087; }
  </style>
</head>
<body>
  <div class="paypal-card">
    <div class="paypal-word">TecnoStock <span>Pay</span></div>

    {% if order %}
      <div class="spinner-border mb-3" role="status"><span class="visually-hidden">Procesando…</span></div>
      <p class="fw-semibold mb-0">Procesando tu pago...</p>
      <p class="text-muted small">Orden {{ order.order_number }} confirmada.</p>
      <script>
        setTimeout(function () {
          if (window.opener) {
            window.opener.location.href = "{% url 'shop:receipt' order.pk %}";
          }
          window.close();
        }, 1200);
      </script>
    {% else %}
      <p class="text-danger">{{ error }}</p>
      <button type="button" class="btn btn-outline-secondary w-100" onclick="window.close()">Cerrar ventana</button>
    {% endif %}
  </div>
</body>
</html>
